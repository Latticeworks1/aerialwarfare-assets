name: Update server status

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install python-a2s

      - run: python scripts/query_status.py

      - name: Commit status.json if it changed
        run: |
          git config user.name "status-bot"
          git config user.email "actions@github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Update server status"
          git push
